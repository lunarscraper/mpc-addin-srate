# mpc-addin-srate – Einstellungen
# Änderungen wirken nach einem Neustart der Force.

# plug = Zielgerät über ALSA-Umrechnung öffnen (48 kHz -> 44,1 kHz)
# log  = nichts verändern, nur mitschreiben, was die Force tut
mode = plug

# Teil des Gerätenamens aus /proc/asound/cards
# (Groß-/Kleinschreibung und Bindestriche egal: "SH-4d" = "sh4d")
match = SH4d

# 1 = auch alle anderen Audiogeräte mitloggen (nur zur Fehlersuche)
verbose = 0

# Logdatei (leer lassen = srate.log im selben Ordner)
# log = /media/Force/srate.log

# Notaus: Eine leere Datei "srate.off" in diesem Ordner schaltet das
# Addin komplett ab (Force neu starten).
